# Mastermind artifact contracts — MW3 Lane A (2026-07-06)
#
# Source of truth for every external artifact Mastermind consumes from the macro
# analyzer's vendored checkout (vendor/macro/site/ + vendor/macro/data/).
#
# Two provenance sections:
#   synapse   — artifacts declared in macro's config/synapse.yml as
#               mastermind:anchor or mastermind:vendored external_consumers.
#               These 16 entries are BAKED here at build time; never runtime-read
#               across repos. Synapse key preserved in comments for traceability.
#   census    — artifacts the Mastermind codebase reads that synapse does NOT
#               declare (section E in data/census/CENSUS.md). declared_by=census.
#
# Per-artifact fields
# -------------------
#   path               path under vendor/macro (the vendored checkout root)
#   owner              always "macro_engine" for vendored artifacts
#   schema_hint        informal type hint (e.g. "json", "jsonl", "json_dir")
#   freshness_budget_sessions
#                      how many nightly sessions old before considered stale.
#                      1 session = ~36h (nightly boundary slack included).
#                      Derived from synapse freshness_sla_hours / 36.
#   tier               from synapse tier vocabulary: infrastructure | display |
#                      shadow | confirmer | scored
#   allowed_effect     sizing-input | context-only | display-only
#                      sizing-input: may directly influence position sizes
#                      context-only: read as context/enrichment; no direct sizing
#                      display-only: rendered but no execution path
#   degradation_class  what happens when the artifact is stale or absent (R3):
#                      FREEZE   — stale beyond budget -> freeze_to_prior (R3/R9)
#                      SHRINK   — stale -> shrink-only degradation
#                      ADVISORY — stale -> log advisory event; execution unchanged
#   consumer_modules   Mastermind modules that read this artifact
#   declared_by        synapse | census

meta:
  schema_version: 1
  description: >
    Mastermind artifact contracts — MW3. Baked from synapse.yml (16 entries) +
    census section E (additional reads). Never runtime-read across repos.
  generated: "2026-07-06"
  synapse_source: "config/synapse.yml (macro repo)"

