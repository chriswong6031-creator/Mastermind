    allowed_effect: sizing-input        # quad + sector_rs drive leadership sleeve sizing
    degradation_class: FREEZE
    consumer_modules:
      - bot/phase2.py                   # regime["sector_rs"], regime["quad"]
      - brain/regime_frame.py           # frame(), budget()
      - brain/etf_board.py              # regime read
