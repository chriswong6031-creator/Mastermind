# ETF Brain — the rotation strategy, externalized as an editable spec.
#
# bot/etf.py + portfolio/etf_universe.py load this at runtime, so you can RETUNE the book here —
# the universe, the hard risk limits, the doctrine the Brain reasons with, the grading horizon —
# WITHOUT touching Python. A missing or malformed file degrades to the in-code defaults, so a bad
# edit never breaks the book (it just falls back).
#
# Scope of a live edit: guardrails + doctrine + horizon are re-read each daily run (no restart);
# the universe is read at import, so a universe change takes effect on the next process start
# (a server restart, or the next `python -m bot.etf`). Env vars still override the guardrails
# (ETF_MAX_SINGLE_WEIGHT / ETF_MIN_TRADE / ETF_OFFENSIVE_CAP_STRESSED / ETF_OFFENSIVE_CAP_ELEVATED).

# --- the tradeable universe (US-listed ETFs only), grouped ------------------
universe:
  core_index:  [SPY, QQQ, IWM, DIA, VTI, RSP]              # broad market building blocks
  sectors:     [XLK, XLF, XLE, XLV, XLU, XLI, XLP, XLY, XLB, XLC, XLRE, SMH, IGV, XBI, XOP]
  factors:     [MTUM, QUAL, USMV, VLUE, SIZE]              # momentum / quality / min-vol / value / size
  duration:    [TLT, IEF]                                  # rate-sensitive ballast
  cash:        [SGOV, BIL, SHV, SHY]                       # T-bill ETFs = cash with yield
  diversifier: [GLD]                                       # gold (optional safe haven)
  # v2: add a `vix: [VIXY]` group here (and a CBOE feed) for a tactical crisis hedge.

# Names that count as the crisis-floor DEFENSIVE bucket on top of all of duration + cash +
# diversifier (which are always defensive). Everything else in the universe is OFFENSIVE and is
# what the crisis floor caps when the tape reads stressed.
defensive_extra: [USMV, XLP, XLU]

# --- hard risk guardrails (enforced in the trusted layer, bot/etf.py) -------
guardrails:
  max_single_weight: 0.35      # cap on any one ETF (excess falls to cash)
  min_trade: 0.015             # turnover throttle: a change smaller than this is NOT traded
  offensive_cap:               # cap on OFFENSIVE gross by risk_state (calm = uncapped)
    stressed: 0.55
    elevated: 0.80
  # overextension brake — a name extended past pct_vs_200d_cap% above its 200d is parabolic; its weight
  # is clamped to max_weight so the book can't ride a blow-off top at size (the 06-22 failure: SMH was
  # +60% vs its 200d and held at 14% the day before it fell -7%). Set pct_vs_200d_cap: null to disable.
  overextension:
    pct_vs_200d_cap: 40        # >40% above the 200d = extended
    max_weight: 0.08           # extended names capped to 8% of NAV
  # DEPRECATED-mirror — do NOT edit this block directly.
  # The authoritative definition lives in config/clusters.yml (cluster id: semis_ai, name:
  # megacap_growth_semis). This block is kept as a fallback: portfolio/etf_universe._clusters_from_shared_config()
  # loads clusters.yml first; if that file is absent/unparseable this block is used instead so the
  # proven G5 brake never weakens during rollout.
  #
  # DRIFT-CHECK: the drift-check test (tests/test_etf_guardrails.py test_cluster_drift_check) asserts
  # that the ETF-universe members (QQQ/XLK/SMH/IGV/MTUM/SIZE) and max_gross here are IDENTICAL to the
  # semis_ai cluster in clusters.yml.  If they diverge the build fails.
  # To tune: edit clusters.yml first, then update THIS mirror to match, then re-run the test suite.
  #
  # NOTE: clusters.yml semis_ai also lists single-name members (NVDA/AVGO/etc.) that are not in the
  # ETF universe — those are ignored by G5 (they can't be in the ETF book). The drift-check only
  # checks that the ETF-universe members from clusters.yml are present here, and max_gross matches.
  factor_clusters:
    - name: megacap_growth_semis
      members: [QQQ, XLK, SMH, IGV, MTUM, SIZE]
      max_gross: 0.35

# --- accountability ----------------------------------------------------------
accountability:
  horizon_days: 21             # forward window each daily pick is graded over, vs SPY (business days)

# --- the doctrine the Brain reasons with (injected into its persona) --------
# Free text. This is the STRATEGY content; the persona scaffolding (identity, the tool process,
# the live guardrail numbers) is generated in code from the sections above, so they never drift.
doctrine: |
  1. CONFIRMATION OVER PREDICTION, BUT NOT CHASING. You cannot time ignition. Prefer ETFs ALREADY
  ranked high in the board's sector_rs table AND above their 200d trend; do not buy a falling knife on
  a narrative. BUT confirmation is not the same as buying the most extended thing: a "leader" already
  +40-60% above its 200d at the 100th percentile is a parabola to size DOWN, not press — the desk
  clamps an over-extended name's weight regardless. Early-following the confirmed leader beats both
  prophesying the next one AND piling into the one that has already run.
  2. REGIME->TILT, conditioned on the tape. Use the board's quad: Q1 Goldilocks -> lean
  growth/tech/momentum (XLK QQQ SMH MTUM QUAL); Q2 Reflation -> cyclicals/value/energy/materials
  (XLE XLF XLB VLUE IWM); Q3 Stagflation -> energy/defensives/short-duration (XLE XLU XLP + SGOV/SHY);
  Q4 Growth-scare -> defensives/duration/min-vol (XLU XLP XLV TLT USMV + cash). This is a PRIOR —
  defer to sector_rs and trend when the tape disagrees.
  3. CASH IS A POSITION, AND A CALM TAPE IS NOT A BUY SIGNAL. Hold T-bill ETFs (SGOV/BIL) deliberately
  as the option premium that funds rotation; do not be reflexively fully invested. A risk_state that
  reads 'calm' is a COINCIDENT read — it is NOT a reason to spend your cash buffer into strength,
  especially with fragility signals lit. De-grossing is cheap; you only get to do it before the move.
  4. CRISIS LADDER. When the board's risk_state is ELEVATED or STRESSED, de-gross: rotate out of
  offensive equity into duration (TLT/IEF), T-bill cash (SGOV/BIL) and optionally gold (GLD). The
  desk caps offensive gross in a stressed read regardless — get there first, deliberately.
  5. THREE EXIT STOPS per holding, set on entry: a trend break (falls below its 200d), a thesis
  invalidation (the regime/leadership that justified it flips), and a time stop (dead capital
  lagging the leader gets rotated). Never average down into a name diverging from a rotating tape.
  6. READ THE FRAGILITY BLOCK — it LEADS, risk_state LAGS. The board's `fragility` carries the signals
  the coincident gauges miss until a move is underway: negative GEX (dealers short gamma -> they
  amplify selloffs), breadth divergence (the index near highs on thin participation), cross-asset
  concentration (a one-factor regime that historically precedes drawdowns), and per-name take-profit
  flags on the very semis/megacaps your ETFs hold. When these light up, DE-GROSS AHEAD of risk_state,
  even on a 'calm' coincident read. This is the difference between confirming a turn and buying the top.
  7. NO SINGLE-FACTOR CONCENTRATION. Many tickers can be ONE bet: SPY/QQQ/SMH/MTUM are mostly the same
  megacap-growth/semis factor, so a "diversified" 7-name book can fall as one. Watch your real factor
  exposure, not your line count — the desk caps the combined gross of the growth/semis/momentum cluster.
  Genuine diversification means uncorrelated sleeves (duration, T-bills, defensives, gold), not five
  flavours of the same beta.
