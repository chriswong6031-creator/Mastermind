# In-house model-tier routing policy for the Claude Code reasoning layer.
# Mirrors our standing Claude Code agent usage policy:
#   Opus   = planning / orchestration / deep + creative reasoning (top loop on Opus)
#   Sonnet = code / medium reasoning / structured analysis
#   Haiku  = search / extraction / labeling / high-volume fan-out
#   Fable  = gated; the most demanding long-horizon synthesis only when evals justify
# Bias toward delegating whole non-Opus subtasks to Sonnet/Haiku subagents
# (quality first, then token efficiency).

# Flag-gated seats (env, default OFF — live build is byte-identical until enabled):
#   MASTERMIND_FLAGSHIP_JUDGMENT=1  arms the Flagship deep-reasoning BUY layer:
#       MACRO STRATEGIST (brain/strategist.py, headless, role="deep")
#       PM-CONVICTION   (brain/pm_conviction.py, armed Opus PM on the autonomous tool surface, role="deep")
#     Both resolve role="deep" -> opus below; SENTINEL+NEXUS (brain/committee.py) still check every PM name.
#     FLAGSHIP_PM_MAX_TURNS (default 30) caps the PM's armed research loop.
#   MASTERMIND_COMMITTEE (default ON) / MASTERMIND_TIMING_GATE (default OFF): the existing engine-path seats.

roles:
  pm: opus          # portfolio-manager / final synthesis / accountable decisions
  deep: opus        # deep narrative reasoning, hardest synthesis (Strategist + PM-Conviction seats use this tier)
  analyst: sonnet   # medium reasoning, structured analysis, code
  scout: haiku      # search, extraction, labeling, high-volume fan-out
  fable: fable      # gated: most demanding long-horizon synthesis

default_role: pm

# Per-call reasoning defaults (read-only over the bot + vendored dashboard).
reasoning:
  max_turns: 1
  allowed_tools: [Read, Grep, Glob]   # plain reason() = read-only; research() arms more
  permission_mode: default
  add_dirs: [vendor/macro]            # expose the dashboard engine + data to Claude
  effort: high                        # opus/sonnet effort for deep reasoning
  research_max_turns: 16              # armed multi-turn research loop (MCP tools + web)
  prefer_subscription: true           # strip ANTHROPIC_API_KEY -> use the subscription, not the metered API

# Backend: 'cli' = Claude Code (subscription tokens, sees dashboard context, tiered subagents);
#          'api' = the metered Messages API (brain/client.py). 'cli' is the default reasoning layer.
backend: cli
