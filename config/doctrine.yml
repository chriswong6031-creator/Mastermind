# Mastermind — thematic rotation & leadership doctrine parameters
# All tunable; defaults are heuristic starting points (mark refinements as you backtest).
# Nothing here is a scored alpha leg — these are display/audit + sizing-veto thresholds.

# ---- confirmation scorecard (6 dims; mirrors theme_scoring leg weights) ----
scorecard:
  weights: { trend: 0.34, breadth: 0.22, impulse: 0.10, macro: 0.20, crowding: 0.14 }
  confluence:
    initial_dims: [rs, breadth]          # 1+2 -> small initial size (Stage 1)
    full_size_gate: catalyst             # dim 5 is mandatory for full size (Stage 2)
    forbid_single_dim: true              # acting on one dimension alone is forbidden
  rs_down_day_lookback_d: 63             # dim 1b "holds up on down days"
  rebuild_interval_days: 1               # gate cadence floor: rebuild the book at least every N days
                                         # even in a stable regime (1 = once per calendar day)

# ---- Stage 0-4 lifecycle classifier thresholds ----
stages:
  latent_rs_pctile_max: 0.50
  latent_breadth_pct50_max: 0.50
  ignition_rs_pctile_max: 0.65
  recognition_score_min: 62
  crowded_z: 1.0
  fourth_deriv_pct_parabolic: 0.30       # Stage 3->4 tell, AND rs_pctile >= 0.80

# ---- three-sleeve architecture + firebreaks ----
sleeves:
  leadership_target: [0.40, 0.60]        # narrative_rotation.allocate() AS-IS, equal-weight
  conviction_target: [0.20, 0.40]        # top_picks + stock_score half-Kelly, falsifiable
  cash_floor: [0.05, 0.20]               # sized, NOT residual
  leadership_rebalance_days: 21          # mechanical monthly cadence (mirror masterminds._REBAL)
  leadership_equal_weight: true          # rank-IC ~ 0; never apply Kelly to this sleeve

caps:
  theme_cap_book: 0.25                   # FIREBREAK A2.1 — cross-sleeve, the NEW glue
  name_cap: 0.08                         # keep OUR tighter value (vs doctrine 0.10-0.15)
  leadership_pos_cap_of_sleeve: 0.30     # narrative_rotation.POS_CAP, per-theme of the sleeve

# ---- W2.2 GRADED EXTENSION SCHEDULE (portfolio/conviction.py entry brake) ----
# A NEW conviction add is SIZE-BRAKED (never flipped, never exited) by how far it has run above its
# 200dma — the proven G4/G5 overextension lever, ported as a graded multiplier on ENTRY size only.
# The parabolic hard veto is UNCHANGED and lives upstream (lenses._hard_vetoes → size_authority
# 'blocked'); this schedule is the softer, graded step BELOW that veto. HELD names are exempt — an
# extension read is an entry-timing brake, not an exit signal (masterplan §0: no exit/veto on a
# held/leading name). Missing extension data → ext_mult 1.0 (the W0 fail-closed gate already blocks
# truly-degraded names; do not double-punish partial data). All thresholds heuristic starting points.
extension_schedule:
  moderate_pct_vs_200dma: 30.0   # (unverified-prior) >= this % above 200dma → NEW add sized at initial-only
  no_add_pct_vs_200dma: 45.0     # (unverified-prior) >= this % above 200dma → NEW add sized to 0.0 (held names untouched)

# ---- W2.1 SHARED LEADERSHIP CAPS (portfolio/sleeves.apply_leadership_caps) ----
# The per-leg brake stack on the LEADERSHIP sleeve (Stage 6.1), ported from the PROVEN ETF-book G4
# overextension guardrail so BOTH books read ONE definition of "how extended is too extended". Each
# leadership leg's weight is scaled by MIN(extension clamp, cycle multiplier):
#   * OVEREXTENSION (G4): an ETF more than `overextension.pct_vs_200d_cap`% above its 200d is a
#     parabola; its leg weight is CLAMPED to `overextension.max_weight` (the 06-22 SMH +60%/held-at-
#     12.5% failure). The read comes from brain.etf_board.etf_trend() — the engine price store, which
#     is OUTAGE-INDEPENDENT of site/stockdata (so the brake still bites during a stockdata gap).
#   * CYCLE (late_cycle): a NEW leg in a late-cycle sector (regime_frame.cycles() late_cycle=True) is
#     HALVED by `late_cycle_mult` (0.5) — an ENTRY-size brake on new leadership legs, NEVER an exit
#     (the walk-forward REFUTED the cycle veto on held/leading sectors — masterplan §0). An unmapped
#     / stale-cycle sector is un-shrunk (multiplier 1.0): a missing mapping only ever REMOVES a shrink.
# SUBTRACT-ONLY: the cap can only reduce a leg's weight; the freed weight goes to CASH, never
# redistributed (doctrine A6). Missing extension data → no clamp (degrade to today's weight). These
# MIRROR config/etf_strategy.yml's guardrails.overextension — the drift-check test
# (tests/test_leadership_caps.py) fails the build if the two definitions diverge.
leadership_caps:
  overextension:
    pct_vs_200d_cap: 40        # (unverified-prior) >this % above 200d → clamp the leg weight (mirror of etf_strategy.yml)
    max_weight: 0.08           # (unverified-prior) an over-extended leadership leg is clamped to this NAV fraction (proven ETF G4)
  late_cycle_mult: 0.5         # (unverified-prior) a NEW leg in a late_cycle sector is halved (entry brake, never an exit)
  # OFFENSIVE-GROSS FLOOR (guard-rail against the compounding-shrink stack — architecture Stage 6.5):
  # after ALL brakes, offensive (leadership) gross must stay >= this fraction of lead_budget unless a
  # parabolic hard veto fired. Enforced as a LOUD runlog tripwire ('over_degross'); see the design note
  # in portfolio/sleeves.apply_leadership_caps for why this is a tripwire, not a proportional scale-back.
  offensive_gross_floor_frac: 0.5   # (unverified-prior) post-brake leadership gross floor as a fraction of lead_budget

# ---- W2.3 REGIME SEED (portfolio/conviction.py — replaces the hardcoded _SHORTLIST) ----
# The 20-name AI/MAG7 _SHORTLIST is DEAD. The leadership seed is now DERIVED: the doctrine
# bottleneck-chain order-layer baskets (bottleneck.chains above) + top-liquidity basket leaders,
# FILTERED to sectors whose sector-cycle phase is entry-favored (Trough / Recovery / Expansion — the
# ONLY walk-forward-defensible cycle use per masterplan §0; NEVER an exit/veto on a held name).
# Invariant-safe: an unmapped/unknown sector is ALLOWED (never blocked on missing data); a stale
# sector_cycles file (empty cycles) degrades to the UNFILTERED basket leaders.
regime_seed:
  max_names: 20                  # (unverified-prior) cap on the derived leadership seed
  leader_top_n_per_basket: 3     # (unverified-prior) top-N members (by 20d return) taken from each seed basket
  liquidity_min_last: 0.0        # (unverified-prior) price floor proxy for the liquidity floor; 0 = no-op
                                 # (baskets.json carries no turnover/mcap, so the numeric floor is inert;
                                 # the seed's liquidity intent is preserved by sourcing from curated baskets)

cash:
  # binding cash = max(macro_implied, rotation_floor) — rotation floor is ORTHOGONAL to macro_risk
  rotation_floor: 0.05                   # the operator's failure was 0% cash in a benign tape
  no_rotation_capacity:                  # detector D3 trip
    cash_max: 0.03
    top_theme_concentration_min: 0.22    # near the 0.25 book cap

# ---- time stop (NEW — the part that failed the operator) ----
time_stop:
  default_window_td: 63                  # ~3 months; per-position override at entry
  unresolved_rel_entry_max: 0.0          # still <= entry on a rel-return basis
  rs_leader_gap_min: 0.10                # held RS lags the current leader by >= this and widening

# ---- bottleneck migration chains (REAL config.yml theme ids) ----
bottleneck:
  chains:
    ai_buildout:
      first_order:  [ai_semiconductors]
      second_order: [memory_storage, semicap_equipment]
      third_order:  [data_center_power, grid_electrification, nuclear_power,
                     copper_steel_electrify, rare_earth_critical_min]
  order_layer_scored: false              # DISPLAY-ONLY tag, never a scored axis
  de_overlap: per_parent_per_order       # <=1 basket per (parent, order_layer)

# ---- failure-mode detectors ----
detectors:
  modes: [self, operator]                # self = hard sizing veto; operator = read-only advisory
  operator_holdings_source: "WATCHLIST.md"
  enabled: [D1, D2, D3, D4, D5, D6]

# ---- macro-risk fragility DWELL STATE MACHINE (brain/macro_risk.risk_state) ----
# The stateless fragility scorer flipped CAUTION -> RISK_ON on the very day SOXX fell -6.4%
# (fragility collapsed as the crash cleared the crowded read) — un-capping the book from 0.7 to
# 1.0 into a live unwind. This block governs the persistent state machine that fixes it: escalate
# instantly on a bad read, de-escalate only slowly (memory), and NEVER un-cap while a tripwire is
# hot. All thresholds are heuristic starting points — resize as the replay/ablation battery matures.
risk_state:
  # DE-ESCALATION deadbands — raw fragility must sit BELOW these to earn a step DOWN. They are
  # deliberately LOWER than the escalation thresholds (0.35 caution / 0.60 risk_off) so a read
  # hovering at the boundary cannot ratchet the state up and down; it must clearly recover.
  caution_exit_frag: 0.28          # (unverified-prior) raw fragility must be < this to leave CAUTION
  risk_off_exit_frag: 0.50         # (unverified-prior) raw fragility must be < this to leave RISK_OFF
  deescalate_sessions: 3           # (unverified-prior) consecutive sub-deadband sessions required to step down
  escalation_cooldown_sessions: 2  # (unverified-prior) sessions that must elapse since the last escalation
  tripwire_clamp_sessions: 2       # (unverified-prior) a sev>=2 tripwire within this many sessions BLOCKS de-escalation
  tripwire_clamp_severity: 2       # (unverified-prior) minimum derisk tripwire severity that clamps
  max_dwell_sessions: 15           # (unverified-prior) a state older than this, persistently below floor, auto-releases one step

# ---- portfolio safety engine (portfolio/safety.py) ----
# Read-only risk backtest of the live book: a static-weight historical simulation of the
# current holdings → max-drawdown / diversification / correlation / beta scorecard.
# All thresholds are display/scoring anchors, NOT scored alpha. Tune as you calibrate.
safety:
  lookback_days: 1825                    # ~5y calendar window for the historical sim
  min_obs_per_name: 60                   # a name needs >= this many closes to be "covered"
  min_obs_total: 120                     # the book needs >= this many aligned days to score
  covered_day_min_frac: 0.70             # keep sim days where >=70% of invested weight is live
  bootstrap_B: 4000                      # block-bootstrap resamples (CI on Sharpe + maxDD)
  bootstrap_block: 21                    # ~1 trading month blocks (preserve autocorrelation)
  # score-mapping anchors: metric value that maps to sub-score 100 (good) / 0 (bad)
  anchors:
    drawdown:    { good: 0.0,   bad: 0.45 }   # |max drawdown| fraction (whole book)
    volatility:  { good: 0.10,  bad: 0.45 }   # annualized volatility
    beta:        { good: 0.85,  bad: 2.00 }   # whole-book beta vs SPY
    cvar:        { good: 0.012, bad: 0.060 }  # |1-day 95% CVaR| fraction
    effective_n: { good: 12.0,  bad: 1.5 }    # 1 / HHI (breadth)
    mean_corr:   { good: 0.20,  bad: 0.80 }   # mean pairwise correlation
    absorption:  { good: 0.35,  bad: 0.90 }   # Kritzman-Page absorption ratio (fragility)
    largest_wt:  { good: 0.08,  bad: 0.30 }   # biggest single-name weight
    top5_wt:     { good: 0.30,  bad: 0.80 }   # top-5 concentration
    sector_hhi:  { good: 0.15,  bad: 0.60 }   # sector-weight HHI
    cash:        { good: 0.20,  bad: 0.00 }   # cash buffer (more = safer, capped at 20%)
  # composite safety-score weights (sum ~1.0)
  score_weights:
    drawdown: 0.22
    volatility: 0.18
    diversification: 0.18
    concentration: 0.14
    beta: 0.12
    tail: 0.10
    cash: 0.06

# ---- severity-decoupled gross caps (bot/derisk.py tripwire) ----
# eff_cap = min(state_gross_cap, severity_cap[severity]) so the cut ALWAYS bites even when the
# macro-risk-state scorer returns risk_on/cap=1.0 on a crash day (the 2026-07-01 no-op).
# Severity 0/1 have no cap override (severity<2 never auto-cuts — caution alone is advisory).
# (unverified-prior) — sized from fragility-chain doctrine; re-calibrate with replay data.
derisk_severity_caps:
  2: 0.70   # confirmed unwind signal (risk_off OR gex_flip OR theme_day ≥ 2 confirmations)
  3: 0.55   # maximum severity (all channels lit; equiv. macro risk_off cap)

# ---- ONE leadership budget equation (architecture Stage 2 — W2) ----
# The single, non-double-counting budget for the leadership sleeve. Confidence × transition ×
# flip-fragility is consumed EXACTLY ONCE here (both the offense-brakes cluster's lead_budget flex
# and the regime-spine cluster's budget_scale were the SAME signal — shipping both double-counts).
#   lead_budget = clamp( base + slope · clamp(confidence,0,1) · T · F ,  floor, ceil )
#     T = transition multiplier {WEAKENING: 0.6, ROLLING/DETERIORATING: 0.4, else 1.0}
#     F = 0.75 if flip_margin < flip_margin_min else 1.0
#     any missing regime field → the equation is skipped and lead_budget = midpoint (today's behavior)
# INVARIANT: this equation can only SHRINK the leadership budget below the ceiling toward the floor;
# a missing/stale/ambiguous frame degrades to the midpoint, never to the ceiling. All constants are
# heuristic priors sized by the E5 regression — re-calibrate, do not treat as validated.
budget:
  base:            0.40   # (unverified-prior) budget floor (also the clamp floor)
  slope:           0.20   # (unverified-prior) confidence-scaled flex above the floor
  floor:           0.40   # (unverified-prior) clamp lower bound
  ceil:            0.60   # (unverified-prior) clamp upper bound
  midpoint:        0.50   # (unverified-prior) missing-field degrade target (= base + 0.5·slope)
  flip_margin_min: 0.15   # (unverified-prior) flip_margin below this earns the F=0.75 fragility damp
  transition_mult:        # (unverified-prior) T by transition_state (unlisted/None -> 1.0)
    WEAKENING:     0.6
    ROLLING:       0.4
    DETERIORATING: 0.4

# ---- sector-cycle read freshness (regime_frame.cycles() — W2) ----
# cycles() is the ONLY consumer of vendor/macro/site/sectordata/sector_cycles.json. When meta.asOf
# is older than this many NYSE trading days, cycles() returns {} and every downstream consumer
# (the entry-tilt seed, the late_cycle new-leg halving) degrades to a no-op. Stale cycle data may
# only REMOVE a tilt/shrink — never impose one — per the master invariant.
cycles:
  stale_after_trading_days: 5   # (unverified-prior) meta.asOf older than this -> cycles() == {}

# ---- us_standouts board gate (P-NEW-2) ----
# The dashboard's standout BUY board publishes its OWN Phase-0 gate verdict, `gate_go`. When it is
# FALSE the board is explicitly "a confluence read, NOT a standalone alpha" (validation_status
# neutral_ic) — i.e. NOT a statistically-validated buy list. When true it is a ranked, gate-cleared
# list. Historically the bot ingested the board unconditionally, seeding buys the dashboard itself
# flagged NO-GO. This toggle makes the bot RESPECT the board's own gate: when gate_go is explicitly
# False the standout source is SKIPPED (names may still arrive via basket / intake / open theses on
# their own merits). Invariant-safe: a MISSING gate_go (legacy artifacts) degrades to today's ingest
# behaviour — only an explicit False skips. Default true = respect the gate.
us_standouts_respect_gate_go: true   # (unverified-prior) skip standout buy-board when its own Phase-0 gate says no-go
