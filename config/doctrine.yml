# Mastermind — thematic rotation & leadership doctrine parameters
# All tunable; defaults are heuristic starting points (mark refinements as you backtest).
# Nothing here is a scored alpha leg — these are display/audit + sizing-veto thresholds.

# ---- confirmation scorecard (6 dims; mirrors theme_scoring leg weights) ----
scorecard:
  weights: { trend: 0.34, breadth: 0.22, impulse: 0.10, macro: 0.20, crowding: 0.14 }
  confluence:
    initial_dims: [rs, breadth]          # 1+2 -> small initial size (Stage 1)
    full_size_gate: catalyst             # dim 5 is mandatory for full size (Stage 2)
    forbid_single_dim: true              # acting on one dimension alone is forbidden
  rs_down_day_lookback_d: 63             # dim 1b "holds up on down days"
  rebuild_interval_days: 1               # gate cadence floor: rebuild the book at least every N days
                                         # even in a stable regime (1 = once per calendar day)

# ---- Stage 0-4 lifecycle classifier thresholds ----
stages:
  latent_rs_pctile_max: 0.50
  latent_breadth_pct50_max: 0.50
  ignition_rs_pctile_max: 0.65
  recognition_score_min: 62
  crowded_z: 1.0
  fourth_deriv_pct_parabolic: 0.30       # Stage 3->4 tell, AND rs_pctile >= 0.80

# ---- three-sleeve architecture + firebreaks ----
sleeves:
  leadership_target: [0.40, 0.60]        # narrative_rotation.allocate() AS-IS, equal-weight
  conviction_target: [0.20, 0.40]        # top_picks + stock_score half-Kelly, falsifiable
  cash_floor: [0.05, 0.20]               # sized, NOT residual
  leadership_rebalance_days: 21          # mechanical monthly cadence (mirror masterminds._REBAL)
  leadership_equal_weight: true          # rank-IC ~ 0; never apply Kelly to this sleeve

caps:
  theme_cap_book: 0.25                   # LEGACY — theme_id cap is DISPLAY-ONLY now (see below), retained for artifact compat
  name_cap: 0.08                         # keep OUR tighter value (vs doctrine 0.10-0.15)
  leadership_pos_cap_of_sleeve: 0.30     # narrative_rotation.POS_CAP, per-theme of the sleeve
  # ---- W3 A2: name-cap exemption REPLACED by a broad-index allowlist ----
  # The old sleeves.py exemption ('if sleeve==leadership: continue') let SMH/XLK/MTUM sit UNCAPPED —
  # SMH held at 12.5% was the single largest risk line. It DIES. Now EVERY position — every sleeve,
  # single names, sector/thematic ETFs (SMH included: DECIDED, architectural over surgical) — is bound
  # by name_cap 0.08, EXCEPT the broad, internally-diversified market indices below, which are capped
  # at the looser broad_index_cap (holding 15% of VTI is not a concentrated bet). No SMH carve-out.
  broad_index_allowlist: [SPY, QQQ, VTI, RSP, IWM, DIA]   # (unverified-prior) internally-diversified market indices
  broad_index_cap: 0.15                  # (unverified-prior) name cap for the broad-index allowlist only
  # ---- W-I Task 5(a): BALLAST asset class — cap-exempt cash equivalents ----
  # The W3 name-cap false-positive: SGOV (T-bill ETF) at 12% was trimmed to 0.08 (-$39.2k of ballast)
  # because it looked like a concentrated bet. T-bill/cash-equivalent ETFs are NOT a concentrated
  # bet — they ARE the cash ballast that funded the rotation dry powder. The fix:
  #   * ballast names are excluded from cluster aggregation (asset_class='ballast', cash-like identity)
  #   * the name-cap for ballast names is ballast_cap (0.40) — not 0.08
  #   * ballast weight still counts toward GROSS (it is NOT leverage-neutral)
  # The allowlist is deliberate and short: T-bill ETFs only (not GLD, not TLT). Any name NOT on
  # this list is treated as a normal position. (unverified-prior)
  ballast_allowlist: [SGOV, BIL, SHY, USFR]    # T-bill / cash-equivalent ETFs — name-cap-exempt ballast
  ballast_cap: 0.40                              # (unverified-prior) max single-name weight for ballast
  # ---- W3 A2: CLUSTER book cap (Stage 6.2 layer) — the fix for theme-cap-defeated-by-per-name-theme-id ----
  # The 0.25 theme_id cap was structurally defeated: leadership legs set theme_id=ticker, so the
  # 0.79-0.94-correlated tech cohort (SMH/XLK/MTUM + conviction tech) never SUMMED — the live book
  # carried Information Technology = 42.6% with breaches:[]. The cluster pass aggregates weight by
  # fragility_chain.cluster_id(ticker) ACROSS BOTH SLEEVES and scales any over-cap cluster DOWN pro-rata
  # (freed weight -> cash, never redistributed). Per-cluster caps live in config/clusters.yml (A1);
  # these are the degrade-safe fallbacks used when that file/lookup is absent. A singleton cluster's cap
  # is the name_cap (a lone name can never 'breach' a cluster cap it already satisfies via the name pass).
  default_cluster_cap: 0.40              # (unverified-prior) max gross book per correlated cluster
  cluster_caps:                          # (unverified-prior) per-cluster overrides (clusters.yml is authoritative when present)
    semis_ai: 0.35                       # the crowded semis/AI cohort — tighter than the default
  # ---- W3 B1: FIRM-WIDE caps (Stage 6.3 — firm_exposure.headroom / clamp_book) ----
  # The BINDING firm cap ACROSS all US books (flagship/autonomous/etf/heavyweight): each book's
  # finalize clamps its own contribution DOWN so the SUMMED firm cluster / name weight fits these caps.
  # AUTHORITATIVE SOURCE is config/clusters.yml (firm_cluster_cap / firm_name_cap) — firm_exposure reads
  # THAT file (one definition, no drift), with these values as the documented (unverified-prior) mirror.
  # Env overrides: MASTERMIND_FIRM_CLUSTER_CAP / MASTERMIND_FIRM_NAME_CAP. The whole clamp is flag-gated
  # by MASTERMIND_FIRM_CAPS (default ON — the audit proved 4 books independently maxed the same SMH).
  firm_cluster_cap: 0.30                 # (unverified-prior) combined per-cluster gross across ALL US books (= clusters.yml)
  firm_name_cap: 0.10                    # (unverified-prior) any single name across ALL US books (= clusters.yml)

# ---- W6 T1: HEAVYWEIGHT MANDATE v2 — firm best-ideas, not a Flagship mirror ----
# The audit: the US books are one bet wearing four hats — Heavyweight was HARD-GATED to Flagship's
# universe, so it could only AMPLIFY Flagship (it force-rotated into Flagship's tech book at the top
# and discarded the defensives). v2 re-points it from amplifier to cross-book concentrator: its
# universe is the UNION of every published book's latest.json (flagship + autonomous + etf, plus
# self_directed once it publishes), with AT MOST ONE name per fragility_chain.cluster_id (the Brain
# picks which expression; the enforcer drops the rest, keep-first-by-conviction). The 5-50% / 8-name
# rails + the W3 firm-headroom clamp are UNCHANGED. Flag-gated MASTERMIND_HW_FIRM_UNIVERSE (default
# ON); the old flagship-only gate survives as the MIRROR FALLBACK (used when the union yields < the
# min fundable count — never an empty book from a data gap, P2) AND as the mirror-shadow A/B arm.
heavyweight:
  min_fundable_names: 4          # (unverified-prior) union must yield >= this many fundable names, else MIRROR fallback
  # rails (mirror config/doctrine — the env vars HEAVYWEIGHT_MIN_WEIGHT/MAX_WEIGHT/MAX_NAMES override in code)
  min_weight: 0.05               # (unverified-prior) per-name floor (sub-floor nibbles dropped)
  max_weight: 0.50               # (unverified-prior) per-name ceiling (concentration cap)
  max_names: 8                   # (unverified-prior) top-N by weight kept

# ---- W2.2 GRADED EXTENSION SCHEDULE (portfolio/conviction.py entry brake) ----
# A NEW conviction add is SIZE-BRAKED (never flipped, never exited) by how far it has run above its
# 200dma — the proven G4/G5 overextension lever, ported as a graded multiplier on ENTRY size only.
# The parabolic hard veto is UNCHANGED and lives upstream (lenses._hard_vetoes → size_authority
# 'blocked'); this schedule is the softer, graded step BELOW that veto. HELD names are exempt — an
# extension read is an entry-timing brake, not an exit signal (masterplan §0: no exit/veto on a
# held/leading name). Missing extension data → ext_mult 1.0 (the W0 fail-closed gate already blocks
# truly-degraded names; do not double-punish partial data). All thresholds heuristic starting points.
extension_schedule:
  moderate_pct_vs_200dma: 30.0   # (unverified-prior) >= this % above 200dma → NEW add sized at initial-only
  no_add_pct_vs_200dma: 45.0     # (unverified-prior) >= this % above 200dma → NEW add sized to 0.0 (held names untouched)

# ---- W2.1 SHARED LEADERSHIP CAPS (portfolio/sleeves.apply_leadership_caps) ----
# The per-leg brake stack on the LEADERSHIP sleeve (Stage 6.1), ported from the PROVEN ETF-book G4
# overextension guardrail so BOTH books read ONE definition of "how extended is too extended". Each
# leadership leg's weight is scaled by MIN(extension clamp, cycle multiplier):
#   * OVEREXTENSION (G4): an ETF more than `overextension.pct_vs_200d_cap`% above its 200d is a
#     parabola; its leg weight is CLAMPED to `overextension.max_weight` (the 06-22 SMH +60%/held-at-
#     12.5% failure). The read comes from brain.etf_board.etf_trend() — the engine price store, which
#     is OUTAGE-INDEPENDENT of site/stockdata (so the brake still bites during a stockdata gap).
#   * CYCLE (late_cycle): a NEW leg in a late-cycle sector (regime_frame.cycles() late_cycle=True) is
#     HALVED by `late_cycle_mult` (0.5) — an ENTRY-size brake on new leadership legs, NEVER an exit
#     (the walk-forward REFUTED the cycle veto on held/leading sectors — masterplan §0). An unmapped
#     / stale-cycle sector is un-shrunk (multiplier 1.0): a missing mapping only ever REMOVES a shrink.
# SUBTRACT-ONLY: the cap can only reduce a leg's weight; the freed weight goes to CASH, never
# redistributed (doctrine A6). Missing extension data → no clamp (degrade to today's weight). These
# MIRROR config/etf_strategy.yml's guardrails.overextension — the drift-check test
# (tests/test_leadership_caps.py) fails the build if the two definitions diverge.
leadership_caps:
  overextension:
    pct_vs_200d_cap: 40        # (unverified-prior) >this % above 200d → clamp the leg weight (mirror of etf_strategy.yml)
    max_weight: 0.08           # (unverified-prior) an over-extended leadership leg is clamped to this NAV fraction (proven ETF G4)
  late_cycle_mult: 0.5         # (unverified-prior) a NEW leg in a late_cycle sector is halved (entry brake, never an exit)
  # OFFENSIVE-GROSS FLOOR (guard-rail against the compounding-shrink stack — architecture Stage 6.5):
  # after ALL brakes, offensive (leadership) gross must stay >= this fraction of lead_budget unless a
  # parabolic hard veto fired. Enforced as a LOUD runlog tripwire ('over_degross'); see the design note
  # in portfolio/sleeves.apply_leadership_caps for why this is a tripwire, not a proportional scale-back.
  offensive_gross_floor_frac: 0.5   # (unverified-prior) post-brake leadership gross floor as a fraction of lead_budget

# ---- W2.3 REGIME SEED (portfolio/conviction.py — replaces the hardcoded _SHORTLIST) ----
# The 20-name AI/MAG7 _SHORTLIST is DEAD. The leadership seed is now DERIVED: the doctrine
# bottleneck-chain order-layer baskets (bottleneck.chains above) + top-liquidity basket leaders,
# FILTERED to sectors whose sector-cycle phase is entry-favored (Trough / Recovery / Expansion — the
# ONLY walk-forward-defensible cycle use per masterplan §0; NEVER an exit/veto on a held name).
# Invariant-safe: an unmapped/unknown sector is ALLOWED (never blocked on missing data); a stale
# sector_cycles file (empty cycles) degrades to the UNFILTERED basket leaders.
regime_seed:
  max_names: 20                  # (unverified-prior) cap on the derived leadership seed
  leader_top_n_per_basket: 3     # (unverified-prior) top-N members (by 20d return) taken from each seed basket
  liquidity_min_last: 0.0        # (unverified-prior) price floor proxy for the liquidity floor; 0 = no-op
                                 # (baskets.json carries no turnover/mcap, so the numeric floor is inert;
                                 # the seed's liquidity intent is preserved by sourcing from curated baskets)

cash:
  # binding cash = max(macro_implied, rotation_floor) — rotation floor is ORTHOGONAL to macro_risk
  rotation_floor: 0.05                   # the operator's failure was 0% cash in a benign tape
  no_rotation_capacity:                  # detector D3 trip
    cash_max: 0.03
    top_theme_concentration_min: 0.22    # near the 0.25 book cap

# ---- time stop (NEW — the part that failed the operator) ----
time_stop:
  default_window_td: 63                  # ~3 months; per-position override at entry
  unresolved_rel_entry_max: 0.0          # still <= entry on a rel-return basis
  rs_leader_gap_min: 0.10                # held RS lags the current leader by >= this and widening

# ---- bottleneck migration chains (REAL config.yml theme ids) ----
bottleneck:
  chains:
    ai_buildout:
      first_order:  [ai_semiconductors]
      second_order: [memory_storage, semicap_equipment]
      third_order:  [data_center_power, grid_electrification, nuclear_power,
                     copper_steel_electrify, rare_earth_critical_min]
  order_layer_scored: false              # DISPLAY-ONLY tag, never a scored axis
  de_overlap: per_parent_per_order       # <=1 basket per (parent, order_layer)

# ---- failure-mode detectors ----
detectors:
  modes: [self, operator]                # self = hard sizing veto; operator = read-only advisory
  operator_holdings_source: "WATCHLIST.md"
  enabled: [D1, D2, D3, D4, D5, D6]

# ---- macro-risk fragility DWELL STATE MACHINE (brain/macro_risk.risk_state) ----
# The stateless fragility scorer flipped CAUTION -> RISK_ON on the very day SOXX fell -6.4%
# (fragility collapsed as the crash cleared the crowded read) — un-capping the book from 0.7 to
# 1.0 into a live unwind. This block governs the persistent state machine that fixes it: escalate
# instantly on a bad read, de-escalate only slowly (memory), and NEVER un-cap while a tripwire is
# hot. All thresholds are heuristic starting points — resize as the replay/ablation battery matures.
risk_state:
  # DE-ESCALATION deadbands — raw fragility must sit BELOW these to earn a step DOWN. They are
  # deliberately LOWER than the escalation thresholds (0.35 caution / 0.60 risk_off) so a read
  # hovering at the boundary cannot ratchet the state up and down; it must clearly recover.
  caution_exit_frag: 0.28          # (unverified-prior) raw fragility must be < this to leave CAUTION
  risk_off_exit_frag: 0.50         # (unverified-prior) raw fragility must be < this to leave RISK_OFF
  deescalate_sessions: 3           # (unverified-prior) consecutive sub-deadband sessions required to step down
  escalation_cooldown_sessions: 2  # (unverified-prior) sessions that must elapse since the last escalation
  tripwire_clamp_sessions: 2       # (unverified-prior) a sev>=2 tripwire within this many sessions BLOCKS de-escalation
  tripwire_clamp_severity: 2       # (unverified-prior) minimum derisk tripwire severity that clamps
  max_dwell_sessions: 15           # (unverified-prior) a state older than this, persistently below floor, auto-releases one step

# ---- portfolio safety engine (portfolio/safety.py) ----
# Read-only risk backtest of the live book: a static-weight historical simulation of the
# current holdings → max-drawdown / diversification / correlation / beta scorecard.
# All thresholds are display/scoring anchors, NOT scored alpha. Tune as you calibrate.
safety:
  lookback_days: 1825                    # ~5y calendar window for the historical sim
  min_obs_per_name: 60                   # a name needs >= this many closes to be "covered"
  min_obs_total: 120                     # the book needs >= this many aligned days to score
  covered_day_min_frac: 0.70             # keep sim days where >=70% of invested weight is live
  bootstrap_B: 4000                      # block-bootstrap resamples (CI on Sharpe + maxDD)
  bootstrap_block: 21                    # ~1 trading month blocks (preserve autocorrelation)
  # score-mapping anchors: metric value that maps to sub-score 100 (good) / 0 (bad)
  anchors:
    drawdown:    { good: 0.0,   bad: 0.45 }   # |max drawdown| fraction (whole book)
    volatility:  { good: 0.10,  bad: 0.45 }   # annualized volatility
    beta:        { good: 0.85,  bad: 2.00 }   # whole-book beta vs SPY
    cvar:        { good: 0.012, bad: 0.060 }  # |1-day 95% CVaR| fraction
    effective_n: { good: 12.0,  bad: 1.5 }    # 1 / HHI (breadth)
    mean_corr:   { good: 0.20,  bad: 0.80 }   # mean pairwise correlation
    absorption:  { good: 0.35,  bad: 0.90 }   # Kritzman-Page absorption ratio (fragility)
    largest_wt:  { good: 0.08,  bad: 0.30 }   # biggest single-name weight
    top5_wt:     { good: 0.30,  bad: 0.80 }   # top-5 concentration
    sector_hhi:  { good: 0.15,  bad: 0.60 }   # sector-weight HHI
    cash:        { good: 0.20,  bad: 0.00 }   # cash buffer (more = safer, capped at 20%)
  # composite safety-score weights (sum ~1.0)
  score_weights:
    drawdown: 0.22
    volatility: 0.18
    diversification: 0.18
    concentration: 0.14
    beta: 0.12
    tail: 0.10
    cash: 0.06

# ---- severity-decoupled gross caps (bot/derisk.py tripwire) ----
# eff_cap = min(state_gross_cap, severity_cap[severity]) so the cut ALWAYS bites even when the
# macro-risk-state scorer returns risk_on/cap=1.0 on a crash day (the 2026-07-01 no-op).
# Severity 0/1 have no cap override (severity<2 never auto-cuts — caution alone is advisory).
# (unverified-prior) — sized from fragility-chain doctrine; re-calibrate with replay data.
derisk_severity_caps:
  2: 0.70   # confirmed unwind signal (risk_off OR gex_flip OR theme_day ≥ 2 confirmations)
  3: 0.55   # maximum severity (all channels lit; equiv. macro risk_off cap)

# ---- DISTRIBUTION ESCALATOR (portfolio/distribution_tells.py + bot/derisk.py — W-I task 1) ----
# Holdings-level distribution EVIDENCE routed through the ALREADY-VALIDATED severity ladder above.
# NOT a new per-name exit predictor (the cycle-phase veto on held leaders was walk-forward REFUTED
# and the macro repo's exit rule was a NO-GO). Instead: when >= book_weight_escalate_frac of book
# WEIGHT sits in names carrying >= min_tells_for_hot distribution tells (crowding + 3D/weekly-MACD
# bear + defensive-RS crossover), the tripwire severity is bumped +1 — composed via max() into the
# ladder (NEVER additive beyond sev-3, which caps at 0.55). SHRINK-ONLY: it can only add severity,
# never un-cap. Every tell degrades to ABSENT on missing data (never fabricated True). All thresholds
# (unverified-prior) — the per-name TRIM ladder that reads these same tells ships in SHADOW with a
# pre-registered 40-call / 21td risk-adjusted falsifier (portfolio/distribution_tells.shadow_trim_ladder).
distribution_tells:
  crowd_pctile_min:          0.95   # (unverified-prior) 60d-return own-history pctile (or board pctile_252d) at/above → crowded
  crowd_lookback_d:          60     # (unverified-prior) the return horizon whose percentile defines crowding
  crowd_pctile_window:       252    # (unverified-prior) trailing window the own-history percentile ranks within
  rs_diff_window:            20     # (unverified-prior) defensive-vs-offensive RS differential lookback (task 3 coordinates on this)
  min_tells_for_hot:         2      # (unverified-prior) a holding is "distributing" at >= this many DETERMINED-TRUE tells
  book_weight_escalate_frac: 0.25   # (unverified-prior) >= this fraction of book weight in distributing names → +1 severity

# ---- ONE leadership budget equation (architecture Stage 2 — W2) ----
# The single, non-double-counting budget for the leadership sleeve. Confidence × transition ×
# flip-fragility is consumed EXACTLY ONCE here (both the offense-brakes cluster's lead_budget flex
# and the regime-spine cluster's budget_scale were the SAME signal — shipping both double-counts).
#   lead_budget = clamp( base + slope · clamp(confidence,0,1) · T · F ,  floor, ceil )
#     T = transition multiplier {WEAKENING: 0.6, ROLLING/DETERIORATING: 0.4, else 1.0}
#     F = 0.75 if flip_margin < flip_margin_min else 1.0
#     any missing regime field → the equation is skipped and lead_budget = midpoint (today's behavior)
# INVARIANT: this equation can only SHRINK the leadership budget below the ceiling toward the floor;
# a missing/stale/ambiguous frame degrades to the midpoint, never to the ceiling. All constants are
# heuristic priors sized by the E5 regression — re-calibrate, do not treat as validated.
budget:
  base:            0.40   # (unverified-prior) budget floor (also the clamp floor)
  slope:           0.20   # (unverified-prior) confidence-scaled flex above the floor
  floor:           0.40   # (unverified-prior) clamp lower bound
  ceil:            0.60   # (unverified-prior) clamp upper bound
  midpoint:        0.50   # (unverified-prior) missing-field degrade target (= base + 0.5·slope)
  flip_margin_min: 0.15   # (unverified-prior) flip_margin below this earns the F=0.75 fragility damp
  transition_mult:        # (unverified-prior) T by transition_state (unlisted/None -> 1.0)
    WEAKENING:     0.6
    ROLLING:       0.4
    DETERIORATING: 0.4

# ---- LIQUIDITY-QUALITY classifier (brain/liquidity_quality.classify — W-I task 2) ----
# The `liquidity_overlay = "expanding"` label the bot bought on (2026-07-01) is a PURE quantity
# read: net_liquidity (WALCL − RRP − TGA) 20d RoC crossed +25bn and printed "expanding" with NO
# regard for HOW it expanded. That +68.9bn was one-day base-effect noise on a flat/ffilled WALCL,
# composed of Treasury-cash drawdown (−TGA) against an RRP facility drained to $6.4bn — MECHANICAL,
# stress-flavoured plumbing, not durable Fed easing. This block adds the QUALITY dimension:
#   quantity RoC  +  composition (dWALCL benign vs −dTGA/−dRRP mechanical)
#   +  RRP-buffer flag (<$100bn ⇒ cushion exhausted)  +  credit/NFCI stress overlay
#     → an `expanding` read reclassifies as STRESS-expansion iff composition is mechanical OR the
#       buffer is exhausted OR credit is confirming; benign-expansion requires POSITIVE benign +
#       calm reads. Missing any series → that component reads 'unknown' and the label degrades
#       toward 'unknown'/'stress' — NEVER toward benign (the incident's exact false positive).
# STANDALONE this wave: classify() only classifies; task 6 wires it (SHRINK-ONLY) into budget().
# All thresholds heuristic priors — re-calibrate with replay data, do not treat as validated.
liquidity_quality:
  roc_window_d:        20      # (unverified-prior) net-liquidity RoC window (trading days; mirrors the engine overlay)
  expand_bn:           25.0    # (unverified-prior) |RoC| >= this = expanding/contracting; below = flat (= engine ±25bn)
  rrp_buffer_bn:       100.0   # (unverified-prior) RRPONTSYD level below this = reserves cushion exhausted (today $6.4bn)
  benign_walcl_share:  0.50    # (unverified-prior) dWALCL share of the gross 20d move >= this = BENIGN composition
  oas_widen_pp:        0.10    # (unverified-prior) HY-OAS 20d change (pp) >= this = credit confirming stress
  oas_z_hot:           1.0     # (unverified-prior) OR HY-OAS trailing z >= this = credit confirming stress
  nfci_window_d:       20      # (unverified-prior) NFCI direction lookback (~4 weeks of weekly prints)

# ---- sector-cycle read freshness (regime_frame.cycles() — W2) ----
# cycles() is the ONLY consumer of vendor/macro/site/sectordata/sector_cycles.json. When meta.asOf
# is older than this many NYSE trading days, cycles() returns {} and every downstream consumer
# (the entry-tilt seed, the late_cycle new-leg halving) degrades to a no-op. Stale cycle data may
# only REMOVE a tilt/shrink — never impose one — per the master invariant.
cycles:
  stale_after_trading_days: 5   # (unverified-prior) meta.asOf older than this -> cycles() == {}

# ---- THE market view (brain/market_view.py — W-E.0 task E0.3) ----
# The one deterministic, freshness+confidence-stamped perception view (charter P7), assembled from
# the planes ALREADY embedded in the regime file the bot reads every build (risk_radar, mtf_signals,
# froth_fragility, risk_state.gross_factor, turning_point, vol_shock, cross_asset, market_drivers,
# dislocation, macro_risk) + regime_frame.cycles() + the W-I planes + the E0.1/E0.2 organs + null
# stubs for the H4-handoff planes. It sizes NOTHING (the wave contract is zero behaviour change); the
# posture decider (E2.x) is a later wave behind Fable sign-off. The disagreement layer is the point:
# net_posture_tilt is built ONLY from VALIDATED, FRESH planes (risk_radar / mtf_signals / cycles — the
# three with on-disk forward grading); advisory/absent/stale planes annotate and shrink but can NEVER
# sign the tilt or lower disagreement (charter P2 — degrade-never-fabricate). Every plane's freshness
# is computed from THAT block's OWN asof, never the file mtime.
market_view:
  stale_after_trading_days: 5   # (unverified-prior) a plane whose OWN asof is older than this many
                                #   NYSE sessions is stale:true -> excluded from the validated tilt
  coverage_floor:          0.30 # (unverified-prior) below this present-plane fraction the view is
                                #   "degraded" (may only refuse to loosen, never tighten offense)

# ---- us_standouts board gate (P-NEW-2) ----
# The dashboard's standout BUY board publishes its OWN Phase-0 gate verdict, `gate_go`. When it is
# FALSE the board is explicitly "a confluence read, NOT a standalone alpha" (validation_status
# neutral_ic) — i.e. NOT a statistically-validated buy list. When true it is a ranked, gate-cleared
# list. Historically the bot ingested the board unconditionally, seeding buys the dashboard itself
# flagged NO-GO. This toggle makes the bot RESPECT the board's own gate: when gate_go is explicitly
# False the standout source is SKIPPED (names may still arrive via basket / intake / open theses on
# their own merits). Invariant-safe: a MISSING gate_go (legacy artifacts) degrades to today's ingest
# behaviour — only an explicit False skips. Default true = respect the gate.
us_standouts_respect_gate_go: true   # (unverified-prior) skip standout buy-board when its own Phase-0 gate says no-go

# ---- defensive candidate generator (portfolio/defensive_candidates.py — W4 A1) ----
# THE ONE canonical defensive-rotation pool, consumed by THREE seats: the additive PM's champion
# pool (W4), the contingent DEF_SLEEVE rotation floor (task B2), and the benchmark ledger's
# regime-conditional basket (W5). One generator so those three never DRIFT (what the PM sees == what
# the floor buys == what the bogey measures). candidates() = deduped union of:
#   (a) defensive_playbook.favor  — driver-conditional (reuses defensive_tilt(); NOT forked)
#   (b) regime_frame.cycles() entry-side — sectors with phaseLabel Bottoming/Prime-entry -> sector ETFs
#       (freshness-gated by cycles() itself: a stale/absent file -> {} -> this source is empty)
#   (c) us_standouts bottoming board single names — RESPECTING gate_go (a NO-GO board drops its
#       single names; the sector-ETF sources a+b are unaffected by the board's gate)
# WEIGHTS: equal-weight prior, explicitly FROZEN until the predictions ledger resolves >=12 defensive
# theses (weights() carries the frozen note). No learned weighting in this wave. INVARIANT: every
# source degrades to [] independently; all sources absent -> [] ('no defensive candidates today', a
# legal no-op consumers must NOT paper over with a fabricated default basket).
defensive_candidates:
  # archetype taxonomy (the DEF_SLEEVE theme_id derives from this); duration is a hedge ONLY in a
  # growth-scare (see defensive_playbook caveats), ballast_cash is dry powder with a coupon.
  archetypes: [duration, quality_defensive, ballast_cash, sector_rotation]   # (unverified-prior)
  # the fresh-entry / bottoming cycle labels that qualify a SECTOR for source (b). Trough->"Bottoming",
  # Recovery->"Prime entry" are the walk-forward-defensible entry-side labels; late-cycle labels
  # (Topping/Rolling over/Trending) do NOT qualify.
  cycle_entry_labels: [Bottoming, "Prime entry"]   # (unverified-prior)

# ---- DETERMINISTIC DEF_SLEEVE rotation floor (portfolio/rotation.py — W4 B2) ----
# The masterplan's PRE-COMMITTED E1-failure branch: if the armed additive PM (task B1) turns out to
# ECHO the engine, this deterministic sleeve ships defensive rotation ANYWAY; it is ALSO the rotation
# FLOOR an armed PM may not undercut (rotation.floor_legs()). It BUYS from portfolio/defensive_
# candidates.py ONLY (the one canonical pool), equal-weight across its FROZEN weights, tagged
# theme_id='DEFENSIVE_<archetype>' so W3's cluster pass sees it.
#
# SIZING (spec 1):
#   fragility_signal = clamp( w_dwell·dwell_level + w_conf·(1-confidence)
#                             + weakening_bump·[transition ∈ weakening_states] , 0, 1 )
#     dwell_level = {risk_on: 0.0, caution: 0.5, risk_off: 1.0}  (unknown state → 0.0)
#     confidence  = regime_frame confidence (missing → 1.0 so the (1-conf) term contributes 0)
#   def_budget = max · fragility_signal      then clamped to the freed leadership de-gross ∩ cash floor
#
# BUDGET DISCIPLINE (spec 3 — no double-claim): the sleeve REDEPLOYS the cash the W2 flex + W2/W3 caps
# already freed FROM leadership; it never levers NEW gross. The binding invariant: total book gross
# with the sleeve ON <= the UN-FLEXED engine gross (conviction + budget.midpoint) AND cash >= the
# doctrine cash floor. Encoded in rotation._headroom.
#
# THE CONTROL ARM: max 0.0 (DEFAULT) → def_budget 0 → the sleeve is INERT → the book is BYTE-IDENTICAL
# to today. ARMING (max > 0, hard-capped at armed_ceiling 0.35) is an OPS decision at the coordinated
# prod restart, NOT a code default. All constants are heuristic priors — re-size with replay data.
def_sleeve:
  max:            0.0     # DEF_SLEEVE_MAX — (unverified-prior) 0 = INERT control arm; armed max 0.35
  armed_ceiling:  0.35    # (unverified-prior) hard clamp on `max` even if over-set (masterplan)
  w_dwell:        0.5     # (unverified-prior) weight on the dwell-state fragility term
  w_conf:         0.3     # (unverified-prior) weight on the (1-confidence) term
  weakening_bump: 0.2     # (unverified-prior) additive bump when transition ∈ weakening_states
  dwell_levels:           # (unverified-prior) dwell state → fragility level (unknown state → 0.0)
    risk_on:  0.0
    caution:  0.5
    risk_off: 1.0
  weakening_states: [WEAKENING, ROLLING, DETERIORATING]   # (unverified-prior) mirror budget.transition_mult keys
  cash_floor:     0.05    # (unverified-prior) mirror of cash.rotation_floor — the sleeve respects it

# ---- THE POSTURE DECIDER (brain/posture_decider.py — W-E.2 task E2.1) ----
# The single posture object decided from market_view BEFORE name selection (charter P5 — perception
# before position).  SHADOW BY DEFAULT: MASTERMIND_POSTURE_DECIDER=0 throughout this wave — the
# decider publishes data/posture/latest.json EVERY build regardless of the flag (the shadow window),
# but NO sizing path reads it until E3.3 arms it (a separate Fable decision).  Flag OFF ⇒ every
# touched module is byte-identical to base (the E3 control arm; tests/test_posture_migration.py).
#
# DEFENSE PRESSURE D = availability-renormalizing EQUAL-WEIGHT mean over the shrink-biased planes
# (regime fragility, transition tilt, flip fragility, W1 dwell, distribution_tells, liquidity_quality,
# regime_nowcast ADVISORY, defensive-RS crossover, and — when a view is supplied — cycles /
# rotation_tensor / anticipation-floor / radar).  A MISSING plane is EXCLUDED from the mean
# (renormalize), NEVER a fabricated zero-risk read; ADVISORY planes may only RAISE D, never lower it.
# EQUAL-WEIGHT PINNED — adaptive per-plane weights are amputated from v1 (cannot clear charter P3 in
# 4 weeks; posture_governor stays the only learner).
#
# ⚠ DENYLISTED FOR self_tune (mirrored in self_tune._HARD_DENYLIST + self_tune.denylist above): the
# class bands and hysteresis are GATE-ADJACENT config — a tuner that could widen the ROTATE-DEFENSIVE
# band or shorten the de-escalation dwell would gerrymander its own posture (charter P8).  All values
# are heuristic priors — the W5 E-regression sizes them later against forward SPY 5d max-drawdown.
posture:
  # CLASS BANDS — the defense_pressure D value at/above which each class is entered.  OFFENSE is the
  # residual below `balanced`.  (unverified-prior; pinned by the incident replay, not hand-tuned.)
  bands:
    balanced:          0.25   # D >= this → BALANCED (else OFFENSE)
    rotate_defensive:  0.50   # D >= this → ROTATE_DEFENSIVE
    preserve:          0.75   # D >= this → PRESERVE
  # PER-CLASS LEVERS.  offense_cap is the class's OFFENSE CEILING, MIN-COMPOSED with the verbatim W2
  # equation (a class can only SHRINK offense toward the floor, never raise it — anti-compounding,
  # ledger row 5).  OFFENSE's cap == the W2 clamp ceil (0.60) so a calm tape is byte-identical to
  # today.  cash_floor / conviction_appetite / posture_notch_cap are the class's other levers;
  # posture_notch_cap is the eff_cap ceiling min-composed in bot/derisk.py ONLY when the flag is ON.
  class_map:
    OFFENSE:          { offense_cap: 0.60, cash_floor: 0.05, conviction_appetite: 1.00, posture_notch_cap: 1.00 }
    BALANCED:         { offense_cap: 0.55, cash_floor: 0.10, conviction_appetite: 0.75, posture_notch_cap: 0.90 }
    ROTATE_DEFENSIVE: { offense_cap: 0.43, cash_floor: 0.15, conviction_appetite: 0.50, posture_notch_cap: 0.70 }
    PRESERVE:         { offense_cap: 0.40, cash_floor: 0.25, conviction_appetite: 0.25, posture_notch_cap: 0.55 }
  # HYSTERESIS — escalate same-session, de-escalate slowly (mirrors macro_risk dwell + tripwire clamp).
  # This makes the 2026-07-01 un-cap structurally impossible: the regressed STABLE print drops raw D
  # but de-escalation is dwell-blocked, so the class is HELD.
  hysteresis:
    deescalate_consecutive:  3    # (unverified-prior) consecutive lower-band builds required to step DOWN
    tripwire_clamp_severity: 2    # (unverified-prior) a sev>=this derisk tripwire BLOCKS de-escalation
    tripwire_clamp_sessions: 2    # (unverified-prior) ...within this many sessions
    max_dwell_sessions:      15   # (unverified-prior) a class held longer than this auto-releases one step
  # defense_floor = def_sleeve.max · D (0 until the sleeve is armed — ONE arming knob shared with the
  # deterministic sleeve; the shadow records the WOULD-BE floor at the armed ceiling for visibility).

# ---- price-action regime NOWCAST (brain/regime_nowcast.nowcast — W-I task 3) ----
# The SECOND OPINION. On 2026-07-01 the macro label read Q1 Goldilocks / STABLE / expanding while
# semis broke down; the PRICE TAPE said "reduce offense" days early. This module re-derives a coarse
# regime read from price action alone — three legs, no dependence on the regressed label — and emits
# a `doubt`/`strong-doubt` verdict a consumer may use ONLY to SHRINK offense (or raise the DEFENSIVE
# floor). SHRINK-ONLY BY CONSTRUCTION: no add-risk verdict exists, and it acts ONLY on a risk-on /
# Goldilocks-class label (a defensive label no-ops it — it can doubt offense, never doubt defense).
# LEGS (signals.md §3): (1) defensive-vs-offensive 20d RS diff > 0 [imported from distribution_tells];
# (2) SMH 3D-MACD bearish STATE [imported from distribution_tells, canon MACD]; (3) %sectors>50d
# FALLING over 5 sessions [owned here]. TALLY: 2-of-3 = doubt, 3-of-3 = strong-doubt. Back-tested:
# soft doubt by 2026-06-24, strong-doubt on 2026-07-01 (day before the SMH rebuy); calm 2025-05
# offense-led uptrend never reaches 2-of-3. WIRING is GATED by the pre-registered walk-forward in
# incidents/2026-07-02-semis-breakdown/nowcast_validation.md (BUDGET_INPUT_QUALIFIED in the module):
# gate PASS => task 6 may wire it into budget() (shrink-only); gate FAIL => advisory-only (lens +
# DEF_SLEEVE unthrottle). STANDALONE this wave — nowcast() only classifies. Heuristic priors.
regime_nowcast:
  rs_diff_window:            20   # (unverified-prior) defensive-vs-offensive RS lookback (trading days; = distribution_tells)
  breadth_ma:                50   # (unverified-prior) sector trend MA for %sectors-above (trading days)
  breadth_falling_lookback:  5    # (unverified-prior) %>50d must FALL over this many sessions
  doubt_legs:                2    # (unverified-prior) legs TRUE for `doubt`
  strong_doubt_legs:         3    # (unverified-prior) legs TRUE for `strong-doubt`

# ---- ROTATION-EVIDENCE damp / unthrottle (regime_frame.budget + rotation.fragility_signal — W-I task 6) ----
# The incident's DETECTION gap: the deployed W0-W4 RESPONSE stack cut correctly once fed a truthful
# read, but every book sat on a wrong-but-fresh Goldilocks/expanding label the bot TRUSTED. The
# dashboard's own planes (defensive-RS crossover, sector cycles, risk_radar CAUTION) already disagreed;
# the bot had no machinery to COUNT that disagreement. This block is that machinery: a shrink-only
# AGREEMENT count over four disagreement sources, routed into two already-validated levers.
#
# THE FOUR EVIDENCE SOURCES (each tri-state True / False / None; None = MISSING = never counts):
#   (1) nowcast_doubt      — brain/regime_nowcast: stance in {doubt, strong-doubt} AND applies==True.
#                            ADVISORY-only per nowcast_validation.md (gate FAILED) — but it is a lens
#                            surface here, sizing a shrink, NOT a budget-return predictor, which the
#                            gate explicitly permits.
#   (2) liquidity_stress   — brain/liquidity_quality: label in {stress-expansion, neutral-hollow}
#                            (the honest 'hollow' read; benign-expansion / contracting / unknown do NOT
#                            agree — unknown NEVER counts).
#   (3) radar_caution      — the dashboard's own risk_radar (brain/risk_prior when present, else the
#                            validated forward_log): state in {caution, risk_off} (never risk_on).
#   (4) defensive_rs_cross — distribution_tells.defensive_offensive_rs_diff: crossed is True.
#
# AGREEMENT = count of sources that are TRUE. Missing sources count as NON-agreeing (never as
# evidence — the invariant: absent data can never manufacture a shrink, only a real disagreement can).
#
# budget() DAMP (shrink-only): 0-1 agree -> ×1.0; 2 agree -> ×0.9; 3+ agree -> ×0.8. The damp
# multiplies the FLEX above the floor and the result is re-clamped to [floor, ceil], so the damp can
# only ever push the budget DOWN toward the 0.40 floor — never up. On a calm tape (0 agreement) the
# damp is 1.0 and budget() is BYTE-IDENTICAL to pre-W-I.
#
# fragility_signal LIFT (unthrottle the '7% when it should be 23%' DEF_SLEEVE): +0.15 per agreeing
# source BEYOND the first, clamped [0,1]. With DEF_SLEEVE_MAX=0 (default) this changes NOTHING live
# (def_budget = 0 · anything = 0) — byte-identical; it only bites once the sleeve is armed.
#
# All constants heuristic priors — re-calibrate with the W5 benchmark ledger, do not treat as validated.
rotation_evidence:
  damp_2_agree:      0.90   # (unverified-prior) budget flex ×this at exactly 2 agreeing sources
  damp_3plus_agree:  0.80   # (unverified-prior) budget flex ×this at 3+ agreeing sources
  lift_per_source:   0.15   # (unverified-prior) fragility_signal += this per agreeing source beyond the first
  # which liquidity_quality labels count as a stress agreement (unknown/benign/contracting do NOT):
  liquidity_stress_labels: [stress-expansion, neutral-hollow]   # (unverified-prior)
  # which risk_radar states count as a caution agreement (risk_on / neutral do NOT):
  radar_caution_states: [caution, risk_off, risk-off]           # (unverified-prior)

