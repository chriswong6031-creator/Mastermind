[Unit]
Description=Mastermind authoritative scheduler and dashboard

[Service]
# The public VPS is the one canonical scheduler/writer. The old Mac scheduler
# must be disabled before this override is activated.
# Keep authoritative runtime state on a VPS-only path. Legacy Mac rsync
# sessions still target /opt/mastermind/data; the service's private mount
# namespace sees this live directory there instead, so a late legacy transfer
# cannot roll the public API backward.
BindPaths=/opt/mastermind-live-data:/opt/mastermind/data
EnvironmentFile=-/etc/macro-api.env
Environment=MASTERMIND_SERVE_ONLY=0
Environment=MASTERMIND_VPS_AUTHORITATIVE=1
Environment=MASTERMIND_JOBSTORE=memory
Environment=MASTERMIND_MACRO_MANAGED_EXTERNALLY=1
Environment=BOT_LLM_BACKEND=waterfall
Environment=MASTERMIND_SHARED_LLM_POOL=1
# Reuse Macro Dashboard's attached ChatGPT account and seven Claude OAuth
# credentials. This file declares no secret values; /etc/macro-api.env remains
# root-only and is the single VPS credential source.
Environment=CODEX_HOME=/var/lib/macro-codex
Environment=CODEX_PROVIDER_ENABLED=1
Environment=MASTERMIND_CODEX_PYTHON=/opt/mastermind/.venv/bin/python
Environment=MASTERMIND_CODEX_TIMEOUT_SEC=1800
Environment=MASTERMIND_CODEX_WEB_SEARCH=1
Environment=MASTERMIND_AI_LOOP=1
Environment=MASTERMIND_AI_REVIEW_LLM=1
Environment=TUSHARE_TIMEOUT_SEC=2
Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
